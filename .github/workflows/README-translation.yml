# This is a basic workflow to help you get started with Actions

name: auto-translation

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches:
      - main
    paths: 
      - README.JA.md

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: 
  contents: write

concurrency:
  group: auto-translation
  cancel-in-progress: true


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  translate:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: check-repo
        uses: actions/checkout@v7

      - name: setup-Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: install-Gemini-Library
        run: | 
          python -m pip install --upgrade pip
          pip install google-genai

      - name: run-translation-script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/translate_readme.py

      - name: commit-changes
        run: | 
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.DE.md README.FR.md README.ES.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Updated README translations"
            git push
            echo "Translations updated successfully."
          fi
